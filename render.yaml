services:
  - type: web
    name: cropshield-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn --app-dir backend app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: APP_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: cropshield_demo
      - key: JWT_SECRET
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "60"
      - key: ML_SERVICE_ENABLED
        value: "false"
      - key: ML_REQUEST_TIMEOUT_SECONDS
        value: "10"
      - key: ML_STATUS_TIMEOUT_SECONDS
        value: "5"
      - key: CORS_ORIGINS
        sync: false
